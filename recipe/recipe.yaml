# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.1"
  python_check_max: "3.14"

package:
  name: update_checker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/u/update_checker/update_checker-${{ version }}.tar.gz
  sha256: d72a8751f36664974a8b2b9d87080efdc0562c5ec07eaa73cd1937c69857db98

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.8.0,<1.0
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - update_checker/**
        - update_checker-${{ version }}.dist-info/**
  - python:
      imports: update_checker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  summary: A python module that will check for package updates.
  license: BSD-2-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/update-checker
  repository: https://github.com/bboe/update_checker

extra:
  recipe-maintainers:
    - proinsias
    - bollwyvl
